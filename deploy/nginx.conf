# Preview server config. Goal: a returning visitor always sees the newest deploy
# without clearing cache or opening a private window.
#
# HTML   -> never stored; every visit fetches the current page.
# Assets -> revalidated on every visit (cheap 304 Not Modified when unchanged).
#           Asset URLs also carry a ?v= tag in index.html, so a changed file under an
#           unchanged filename (e.g. img/hero.webp) is fetched as a brand new URL.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Pages: always revalidate, never serve from cache.
  location ~* \.html$ {
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    expires -1;
  }

  # Images, styles, scripts, fonts: revalidate, then 304 if the file has not changed.
  location ~* \.(webp|png|jpe?g|gif|svg|ico|css|js|woff2?|txt)$ {
    add_header Cache-Control "no-cache" always;
  }

  location / {
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-cache" always;
  }
}
